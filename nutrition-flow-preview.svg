<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <style>
    text{font-family:Arial,'Microsoft JhengHei',sans-serif;fill:#183126}.small{font-size:17px;fill:#6a776f}.label{font-size:16px;font-weight:bold;fill:#1e714b}.title{font-size:28px;font-weight:700}.sub{font-size:19px;fill:#6a776f}.ui{font-size:16px}.button{font-size:17px;font-weight:700;fill:white}.big{font-size:50px;font-weight:800}.num{font-size:25px;font-weight:800}.muted{font-size:14px;fill:#6a776f}</style>
  <rect width="1600" height="1050" fill="#f8f6ef"/><text x="80" y="78" font-size="38" font-weight="800">食析 · 使用流程預覽</text><text x="80" y="112" class="sub">從上傳食物照片到查看一餐營養摘要</text>
  <!-- 1 --> <text x="80" y="178" class="label">01 ／ 上傳照片</text><rect x="80" y="200" width="670" height="330" rx="22" fill="white" stroke="#dfe5d9" stroke-width="2"/><text x="110" y="246" font-size="23" font-weight="800">食析</text><rect x="110" y="275" width="610" height="190" rx="15" fill="#fcfdf9" stroke="#b8cbb6" stroke-width="2" stroke-dasharray="9 8"/><path d="M415 326v-36m0 0-14 14m14-14 14 14M380 353v23h70v-23" fill="none" stroke="#1e714b" stroke-width="3" stroke-linecap="round"/><text x="350" y="409" class="title">上傳餐點照片</text><text x="338" y="438" class="small">拖曳圖片至此，或點擊選擇</text><rect x="110" y="478" width="610" height="32" rx="8" fill="#1e714b"/><text x="375" y="500" class="button">開始分析</text>
  <!-- arrow --> <path d="M770 365h55m-16-15 16 15-16 15" fill="none" stroke="#88a18e" stroke-width="3"/>
  <!-- 2 --> <text x="850" y="178" class="label">02 ／ 確認圖片</text><rect x="850" y="200" width="670" height="330" rx="22" fill="white" stroke="#dfe5d9" stroke-width="2"/><text x="880" y="246" font-size="23" font-weight="800">食析</text><rect x="880" y="274" width="205" height="150" rx="12" fill="#dcebc9"/><ellipse cx="982" cy="355" rx="71" ry="34" fill="#fffdf4"/><ellipse cx="954" cy="345" rx="25" ry="13" fill="#f0f0e4"/><rect x="995" y="325" width="35" height="23" rx="4" fill="#c7834d"/><circle cx="1018" cy="365" r="13" fill="#73af61"/><text x="1110" y="322" class="title">午餐便當.jpg</text><text x="1110" y="354" class="small">照片已選擇，準備辨識食材</text><rect x="880" y="456" width="610" height="43" rx="10" fill="#1e714b"/><text x="1115" y="483" class="button">開始分析</text>
  <!-- 3 --> <text x="80" y="626" class="label">03 ／ AI 分析中</text><rect x="80" y="648" width="670" height="330" rx="22" fill="white" stroke="#dfe5d9" stroke-width="2"/><text x="110" y="694" font-size="23" font-weight="800">食析</text><circle cx="415" cy="790" r="42" fill="none" stroke="#d9f2b1" stroke-width="10"/><path d="M415 748a42 42 0 0 1 37 23" fill="none" stroke="#1e714b" stroke-width="10" stroke-linecap="round"/><text x="326" y="860" class="title">正在辨識食材…</text><text x="267" y="892" class="small">推估菜色、份量與營養組成</text><rect x="220" y="925" width="390" height="8" rx="4" fill="#e8eee4"/><rect x="220" y="925" width="245" height="8" rx="4" fill="#1e714b"/>
  <!-- arrow --> <path d="M770 810h55m-16-15 16 15-16 15" fill="none" stroke="#88a18e" stroke-width="3"/>
  <!-- 4 --> <text x="850" y="626" class="label">04 ／ 營養摘要</text><rect x="850" y="648" width="670" height="330" rx="22" fill="white" stroke="#dfe5d9" stroke-width="2"/><text x="880" y="694" class="title">這餐的營養摘要</text><text x="880" y="720" class="small">根據照片中的食材與視覺份量推估</text><text x="880" y="790" class="big">533</text><text x="1000" y="790" class="sub">kcal</text><text x="880" y="818" class="muted">估計整份餐點的總熱量</text><rect x="880" y="844" width="122" height="92" rx="11" fill="#f5f8f1"/><text x="894" y="871" class="muted">蛋白質</text><text x="894" y="910" class="num">45 g</text><rect x="1014" y="844" width="122" height="92" rx="11" fill="#f5f8f1"/><text x="1028" y="871" class="muted">碳水化合物</text><text x="1028" y="910" class="num">59 g</text><rect x="1148" y="844" width="122" height="92" rx="11" fill="#f5f8f1"/><text x="1162" y="871" class="muted">脂肪</text><text x="1162" y="910" class="num">15 g</text><text x="1300" y="766" font-size="17" font-weight="700">辨識食物</text><text x="1300" y="801" class="ui">白飯　235 kcal</text><text x="1300" y="832" class="ui">烤雞胸　165 kcal</text><text x="1300" y="863" class="ui">青花菜　28 kcal</text><text x="1300" y="894" class="ui">炒蛋　105 kcal</text>
</svg>
