<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<style>text{font-family:Arial,'Microsoft JhengHei',sans-serif;fill:#183126}.h{font-size:30px;font-weight:800}.s{font-size:16px;fill:#6a776f}.l{font-size:15px;font-weight:800;fill:#1e714b}.b{font-size:17px;font-weight:700}.n{font-size:30px;font-weight:800}.t{font-size:14px;fill:#6a776f}.pill{font-size:13px;font-weight:700;fill:#1e714b}.btn{font-size:15px;font-weight:700;fill:#fff}</style>
<rect width="1600" height="1080" fill="#f8f6ef"/><text x="70" y="72" class="h" font-size="40">食析 · 拳頭與掌心份量追蹤</text><text x="70" y="105" class="s">不計克數：紀錄每餐、回顧食物、確認今日是否達標</text>
<!-- card 1 --> <text x="70" y="168" class="l">步驟 1 ／ 新增一餐</text><rect x="70" y="190" width="690" height="360" rx="22" fill="#fff" stroke="#dfe5d9" stroke-width="2"/><text x="102" y="232" class="b" font-size="22">食析</text><rect x="102" y="255" width="125" height="32" rx="16" fill="#1e714b"/><text x="122" y="276" class="btn">新增一餐</text><text x="246" y="276" class="t">吃過的食物　　今日目標</text><text x="102" y="335" class="h">拍下這餐，看懂你吃了什麼。</text><text x="102" y="365" class="s">用拳頭、掌心與份數，快速記錄每餐份量。</text><rect x="102" y="397" width="625" height="112" rx="13" fill="#fcfdf9" stroke="#b8cbb6" stroke-width="2" stroke-dasharray="7 7"/><text x="347" y="440" class="b">上傳餐點照片</text><text x="319" y="469" class="t">拖曳圖片至此，或點擊選擇</text><rect x="102" y="520" width="625" height="18" rx="7" fill="#1e714b"/>
<!-- arrow --><path d="M790 360h44m-13-12 13 12-13 12" fill="none" stroke="#89a28f" stroke-width="3"/>
<!-- card 2 --> <text x="860" y="168" class="l">步驟 2 ／ 確認份量並儲存</text><rect x="860" y="190" width="670" height="360" rx="22" fill="#fff" stroke="#dfe5d9" stroke-width="2"/><text x="892" y="234" class="h" font-size="25">這餐的份量摘要</text><text x="892" y="262" class="t">以手部份量快速紀錄，不需秤重</text><rect x="892" y="290" width="258" height="130" rx="14" fill="#f5f8f1"/><text x="911" y="324" class="t">蔬菜</text><text x="911" y="374" class="n">1 拳</text><rect x="1162" y="290" width="158" height="130" rx="14" fill="#f5f8f1"/><text x="1180" y="324" class="t">碳水</text><text x="1180" y="374" class="n">1 拳</text><rect x="1332" y="290" width="158" height="130" rx="14" fill="#f5f8f1"/><text x="1350" y="324" class="t">蛋白質</text><text x="1350" y="374" class="n">1.35 掌</text><text x="892" y="458" class="b">辨識食物與份量</text><text x="892" y="488" class="s">白飯（碳水 1 拳）　烤雞胸（蛋白質 1 掌）</text><text x="892" y="516" class="s">青花菜（蔬菜 1 拳）　炒蛋（蛋白質 1 份）</text><rect x="1250" y="456" width="240" height="47" rx="10" fill="#1e714b"/><text x="1305" y="486" class="btn">加入今天紀錄</text>
<!-- card 3 --> <text x="70" y="640" class="l">頁面 3 ／ 吃過的食物</text><rect x="70" y="662" width="690" height="350" rx="22" fill="#fff" stroke="#dfe5d9" stroke-width="2"/><text x="102" y="712" class="h">吃過的食物</text><text x="102" y="741" class="s">今天已記錄的每一餐</text><rect x="102" y="771" width="625" height="96" rx="13" fill="#fff" stroke="#dfe5d9"/><text x="124" y="806" class="b">午餐便當</text><text x="124" y="836" class="t">12:30 · 白飯、烤雞胸、青花菜、炒蛋</text><rect x="478" y="788" width="65" height="29" rx="14" fill="#eef4e6"/><text x="489" y="808" class="pill">🥦 1 拳</text><rect x="550" y="788" width="65" height="29" rx="14" fill="#eef4e6"/><text x="561" y="808" class="pill">🍚 1 拳</text><rect x="622" y="788" width="82" height="29" rx="14" fill="#eef4e6"/><text x="631" y="808" class="pill">🍳 1.35 掌</text><text x="102" y="925" class="t">每一筆餐點均可回顧餐名、時間、食物與份量。</text>
<!-- arrow --><path d="M790 830h44m-13-12 13 12-13 12" fill="none" stroke="#89a28f" stroke-width="3"/>
<!-- card 4 --> <text x="860" y="640" class="l">頁面 4 ／ 今日目標</text><rect x="860" y="662" width="670" height="350" rx="22" fill="#fff" stroke="#dfe5d9" stroke-width="2"/><text x="892" y="712" class="h">今日目標</text><text x="892" y="741" class="s">用你的手，掌握一天的均衡飲食。</text><text x="892" y="794" class="b">🥦 蔬菜　1 / 6 拳頭</text><rect x="892" y="808" width="570" height="11" rx="6" fill="#eef1eb"/><rect x="892" y="808" width="95" height="11" rx="6" fill="#1e714b"/><text x="892" y="861" class="b">🍚 碳水化合物　1 / 3 拳頭</text><rect x="892" y="875" width="570" height="11" rx="6" fill="#eef1eb"/><rect x="892" y="875" width="190" height="11" rx="6" fill="#1e714b"/><text x="892" y="928" class="b">🍳 蛋白質　1.35 / 4 掌心</text><rect x="892" y="942" width="570" height="11" rx="6" fill="#eef1eb"/><rect x="892" y="942" width="192" height="11" rx="6" fill="#1e714b"/><text x="1214" y="974" class="t">蛋白質亦可參考 9 份目標</text>
</svg>
