<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240">
<style>text{font-family:Arial,'Microsoft JhengHei',sans-serif;fill:#183126}.title{font-size:37px;font-weight:800}.head{font-size:24px;font-weight:800}.step{font-size:15px;font-weight:800;fill:#1e714b}.body{font-size:15px;fill:#6a776f}.ui{font-size:14px}.strong{font-size:16px;font-weight:700}.btn{font-size:14px;font-weight:700;fill:#fff}.pill{font-size:11px;font-weight:700;fill:#1e714b}</style><rect width="1680" height="1240" fill="#f8f6ef"/><text x="65" y="65" class="title">食析 · 每日與月統計完整預覽</text><text x="65" y="98" class="body">日期選擇 → 單日餐點／自檢 → 月曆回顧；可在手機上自動重排使用。</text>
