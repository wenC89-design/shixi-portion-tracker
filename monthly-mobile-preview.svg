<!-- 2 --><text x="600" y="157" class="step">02 ／ 確認份量並儲存</text><rect x="600" y="176" width="475" height="275" rx="19" fill="#fff" stroke="#dfe5d9" stroke-width="2"/><text x="628" y="216" class="head">這餐的份量摘要</text><rect x="628" y="242" width="125" height="92" rx="10" fill="#f5f8f1"/><text x="643" y="271" class="body">蔬菜</text><text x="643" y="308" class="head">1 拳</text><rect x="765" y="242" width="125" height="92" rx="10" fill="#f5f8f1"/><text x="780" y="271" class="body">碳水</text><text x="780" y="308" class="head">1 拳</text><rect x="902" y="242" width="145" height="92" rx="10" fill="#f5f8f1"/><text x="917" y="271" class="body">蛋白質</text><text x="917" y="308" class="head">1.35 掌</text><rect x="628" y="374" width="419" height="40" rx="9" fill="#1e714b"/><text x="752" y="400" class="btn">加入今天紀錄</text>
<!-- 3 --><text x="1135" y="157" class="step">03 ／ 單日紀錄</text><rect x="1135" y="176" width="475" height="275" rx="19" fill="#fff" stroke="#dfe5d9" stroke-width="2"/><text x="1163" y="216" class="head">吃過的食物</text><rect x="1163" y="240" width="418" height="32" rx="8" fill="#f5f8f1"/><text x="1293" y="262" class="ui">正在查看：2026-08-29　⌄</text><rect x="1163" y="291" width="418" height="92" rx="11" fill="#fff" stroke="#dfe5d9"/><text x="1181" y="321" class="strong">午餐便當</text><text x="1181" y="348" class="body">白飯、雞胸、青花菜、炒蛋</text><text x="1181" y="371" class="pill">🥦 1 拳　🍚 1 拳　🍳 1.35 掌</text>
