<!-- 6 --><text x="1340" y="528" class="step">06 ／ 自檢表：下載或複製</text><rect x="1340" y="547" width="270" height="490" rx="19" fill="#fff" stroke="#dfe5d9" stroke-width="2"/><text x="1361" y="584" class="strong">08/29 自檢表</text><text x="1361" y="621" class="ui">飲食 3/4/6</text><text x="1361" y="647" class="body">實際：1/1.35/1</text><text x="1361" y="691" class="ui">水：2500 ML</text><text x="1361" y="722" class="ui">邪惡食：無</text><text x="1361" y="753" class="ui">聚餐：N</text><text x="1361" y="784" class="ui">睡眠：6.5 小時</text><text x="1361" y="815" class="ui">壓力 3　疲勞 4</text><text x="1361" y="846" class="ui">便便 1　水腫 2</text><text x="1361" y="877" class="ui">飽足 7</text><rect x="1361" y="914" width="104" height="42" rx="8" fill="#1e714b"/><text x="1374" y="940" class="btn">下載 .txt</text><rect x="1474" y="914" width="110" height="42" rx="8" fill="#fff" stroke="#dfe5d9"/><text x="1490" y="940" class="strong" font-size="13">複製文字</text><text x="65" y="1140" class="head">手機版自動縮放</text><text x="65" y="1172" class="body">卡片與自檢欄位改為單欄；月曆縮小格距並以綠點提示有紀錄的日期，維持手指可點選的大小。</text>
