<rect width="1680" height="1200" fill="#f8f6ef"/><text x="70" y="70" class="title">食析 · 每日紀錄與自檢流程</text><text x="70" y="103" class="body">所有餐點與自檢資料都依選取日期保存；需要回顧時可直接切換日期。</text>
